name: Stage charts

# Charts v2: stages the prometheus-federator charts as OCI artifacts in the staging
# catalog registry with cargueiro, and starts their release in rancher/charts.
# It runs next to the push-to-charts workflow, which stays as it is, so both
# release paths work at the same time.
#
# It is started by hand, for a release that already exists, so nothing has to be
# tagged to stage the charts of a release:
#
#   gh workflow run stage-charts.yaml --ref main -f tag=v8.0.0-rc.1
#
# The version comes from the GitHub release of the tag, which must be published
# and have its chart archive: the release is made public after the images are
# pushed, so the charts are never staged for an image that is not there. The chart
# is the one scripts/package-helm already built and stamped for that release, so
# it is downloaded and extracted as it is, not rebuilt from the repository. The
# ship-family-staged action of rancher/charts stamps, checks, packages and
# pushes it, and then starts the chart-staged workflow of rancher/charts, which
# ships the chart and opens a pull request that adds it to the index.yaml of its
# staging branch.
#
# The action is pinned to a commit of the chart-owners branch of rancher/charts,
# which holds only the shared actions, so it moves only when they change.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose charts are staged, e.g. v8.0.0-rc.1"
        required: true
        type: string

permissions: {}

jobs:
  stage-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    steps:
      # The branch the workflow runs from has the scripts.
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag goes through the environment, never into a script, and is the one
      # of the release from here on.
      - name: Read the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag=$(./.github/workflows/scripts/read-release.sh "$TAG")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the chart
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: ./.github/workflows/scripts/download-chart.sh "$TAG" "$RUNNER_TEMP/charts"

      - name: Stage the charts and notify rancher/charts
        uses: rancher/charts/.github/actions/ship-family-staged@chart-owners # chart-owners
        with:
          family: prometheus-federator
          chart-dirs: |
            ${{ runner.temp }}/charts/prometheus-federator
