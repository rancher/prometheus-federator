name: golangci-lint

on:
  pull_request:
    paths-ignore:
    - 'docs/**'
    - '*.md'
    - '.gitignore'
    - 'CODEOWNERS'
    - 'LICENSE'

permissions:
  contents: read

jobs:
  golangci:
    uses: rancher/prometheus-federator/.github/workflows/lint.yaml@67377410d8d2b9507402e8c51bb8f39a36761d71 # automation-core
    with:
      helm-version: 'v4.3.0'
