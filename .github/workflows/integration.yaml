name : Integration test

permissions:
  contents : read

on:
  workflow_call:
  push:
    branches:
      - main
      - release/v[0-9]+.(0|x)
      - release/v[0-9]+.[0-9]+.[0-9]+
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
  pull_request:
    paths-ignore:
    - 'docs/**'
    - '*.md'
    - '.gitignore'
    - 'CODEOWNERS'
    - 'LICENSE'

jobs:
  test:
    uses: rancher/prometheus-federator/.github/workflows/integration.yaml@automation-core
    with:
      helm-version: 'v3.19.5'
      k3s-versions: '["v1.33.7-k3s3","v1.35.0-k3s3"]'
      yq-checksum-amd64: 'a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7'
      yq-checksum-arm64: '0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156'
