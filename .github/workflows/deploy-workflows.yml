name: Deploy Workflows

on:
  workflow_dispatch:
    inputs:
      targetBranch:
        description: "The branch to deploy workflows to (e.g., 'main', 'release/v6.x'). Must have an entry in deploy-config.yaml"
        required: true
        type: string
      automationCoreRef:
        description: "Automation-core ref to pin the deployed workflows to (default: 'automation-core', or a tag like 'v1')"
        required: false
        default: "automation-core"
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation-core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          path: automation-core

      - name: Read GitHub App Credentials from Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/workflow-deployer/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/workflow-deployer/app-credentials privateKey | PRIVATE_KEY ;

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.targetBranch }}
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true
          path: target-repo

      - name: Create branch, apply templates, and create PR
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          APP_USER: ${{ steps.generate_token.outputs.app-slug }}[bot]
          TARGET_BRANCH: ${{ inputs.targetBranch }}
          AUTOMATION_CORE_REF: ${{ inputs.automationCoreRef }}
        run: |
          set -euo pipefail

          strip_quotes() {
            local val="$1"
            val="${val#\'}"; val="${val%\'}"
            val="${val#\"}"; val="${val%\"}"
            printf '%s' "$val"
          }
          TARGET_BRANCH="$(strip_quotes "$TARGET_BRANCH")"
          AUTOMATION_CORE_REF="$(strip_quotes "$AUTOMATION_CORE_REF")"

          CONFIG_FILE="automation-core/deploy-config.yaml"
          if [ "$(yq eval ".[\"${TARGET_BRANCH}\"]" "$CONFIG_FILE")" = "null" ]; then
            echo "ERROR: no entry for branch '${TARGET_BRANCH}' in deploy-config.yaml"
            exit 1
          fi
          HELM_VERSION=$(yq eval ".[\"${TARGET_BRANCH}\"].helmVersion" "$CONFIG_FILE")
          K3S_VERSIONS=$(yq eval -o=json -I=0 ".[\"${TARGET_BRANCH}\"].k3sVersions" "$CONFIG_FILE")
          YQ_CHECKSUM_AMD64=$(yq eval ".[\"${TARGET_BRANCH}\"].yqChecksumAmd64 // \"\"" "$CONFIG_FILE")
          YQ_CHECKSUM_ARM64=$(yq eval ".[\"${TARGET_BRANCH}\"].yqChecksumArm64 // \"\"" "$CONFIG_FILE")

          DEPLOY_BRANCH="deploy-workflows-$(date +%Y-%m-%d-%H-%M-%S)"

          git config --global user.email "${APP_USER}@users.noreply.github.com"
          git config --global user.name "${APP_USER}"

          # Create staging directory for templates
          STAGING_DIR=$(mktemp -d)

          for tmpl in ci lint integration prom-fed-e2e-ci pr-debug-publish release; do
            sed \
              -e "s|{{HELM_VERSION}}|${HELM_VERSION}|g" \
              -e "s|{{K3S_VERSIONS}}|${K3S_VERSIONS}|g" \
              -e "s|{{YQ_CHECKSUM_AMD64}}|${YQ_CHECKSUM_AMD64}|g" \
              -e "s|{{YQ_CHECKSUM_ARM64}}|${YQ_CHECKSUM_ARM64}|g" \
              -e "s|{{AUTOMATION_CORE_REF}}|@${AUTOMATION_CORE_REF}|g" \
              "automation-core/workflow-templates/${tmpl}.yaml.tmpl" \
              > "${STAGING_DIR}/${tmpl}.yaml"
          done

          echo "Validating generated workflow files..."
          for workflow in "${STAGING_DIR}"/*.yaml; do
            echo "  Validating $(basename "$workflow")..."
            yq eval '.' "$workflow" > /dev/null || {
              echo "ERROR: Invalid YAML in $(basename "$workflow")"
              exit 1
            }
          done
          echo "All workflow files are valid YAML"

          cd target-repo
          git checkout -b "${DEPLOY_BRANCH}"

          mkdir -p .github/workflows
          cp "${STAGING_DIR}"/*.yaml .github/workflows/
          git add .github/workflows/

          if git diff --cached --quiet; then
            echo "No changes to commit - workflows are already up to date"
            exit 0
          fi

          bash ../automation-core/.github/scripts/generate-commit-msg.sh \
            "${TARGET_BRANCH}" "${HELM_VERSION}" "${K3S_VERSIONS}" "${AUTOMATION_CORE_REF}" "${GITHUB_SHA}" > /tmp/commit_msg

          git commit -F /tmp/commit_msg
          git push origin "${DEPLOY_BRANCH}"

          bash ../automation-core/.github/scripts/generate-pr-body.sh \
            "${TARGET_BRANCH}" "${HELM_VERSION}" "${K3S_VERSIONS}" "${AUTOMATION_CORE_REF}" "${GITHUB_SHA}" "${GITHUB_ACTOR}" > /tmp/pr_body

          CREATED_PR=$(gh pr create \
            -R "${{ github.repository }}" \
            --title "Deploy automation-core workflows to ${TARGET_BRANCH}" \
            --body-file /tmp/pr_body \
            --base "${TARGET_BRANCH}" \
            --head "${DEPLOY_BRANCH}")

          {
            echo "## Deployment Summary"
            echo ""
            echo "**Target branch**: \`${TARGET_BRANCH}\`"
            echo "**Helm version**: \`${HELM_VERSION}\`"
            echo "**K3S versions**: \`${K3S_VERSIONS}\`"
            echo "**Automation-core ref**: \`@${AUTOMATION_CORE_REF}\`"
            echo ""
            echo "**Created PR**: ${CREATED_PR}"
          } >> "$GITHUB_STEP_SUMMARY"
