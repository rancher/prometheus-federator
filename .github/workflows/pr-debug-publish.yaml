name: Produce PR dev images (on Request)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number to build image for'
        required: true
        type: number

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  pull-requests: write

jobs:
  produce-pr-images:
    uses: rancher/prometheus-federator/.github/workflows/pr-debug-publish.yaml@automation-core
    with:
      pr_number: ${{ inputs.pr_number }}
      yq-checksum-amd64: 'a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7'
      yq-checksum-arm64: '0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156'
