name: "[prom-fed] E2E CI"

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logs"
        required: false
        default: "false"
      k3s_version:
        description: "Version of k3s to use for the underlying cluster, should exist in https://hub.docker.com/r/rancher/k3s/tags"
        required: false
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'Makefile'
  push:
    branches:
      - main
      - release/v[0-9]+.x
      - release/v[0-9]+.[0-9]+.[0-9]+
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  e2e-prometheus-federator:
    uses: rancher/prometheus-federator/.github/workflows/prom-fed-e2e-ci.yaml@automation-core
    with:
      helm-version: 'v3.19.5'
      debug: ${{ inputs.debug }}
      k3s_version: ${{ inputs.k3s_version }}
      yq-checksum-amd64: 'a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7'
      yq-checksum-arm64: '0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156'
