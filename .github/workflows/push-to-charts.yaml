name: Push to rancher/charts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g. v7.0.1-rc.2)'
        required: true
        type: string

jobs:
  push-to-charts:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/charts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--charts--pull_requests--write token | GH_TOKEN

      - name: Push chart update to rancher/charts
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ env.GH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          PF_DIR: ${{ github.workspace }}
          CHARTS_DIR: ${{ github.workspace }}/charts-repo
        run: ./.github/workflows/push-to-charts/run-gha.sh
