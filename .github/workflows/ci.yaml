name: "[prom-fed] ci"

on:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'Makefile'
  push:
    branches:
      - main
      - release/v[0-9]+.x
      - release/v[0-9]+.[0-9]+.[0-9]+
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

jobs:
  build:
    uses: rancher/prometheus-federator/.github/workflows/ci.yaml@67377410d8d2b9507402e8c51bb8f39a36761d71 # automation-core
    with:
      helm-version: 'v4.3.0'
      yq-checksum-amd64: ''
      yq-checksum-arm64: ''
