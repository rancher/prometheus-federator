name: "[prom-fed] ci"

on:
  workflow_call:
    inputs:
      helm-version:
        required: true
        type: string
      yq-checksum-amd64:
        required: false
        type: string
        default: ''
      yq-checksum-arm64:
        required: false
        type: string
        default: ''

env:
  CGO_ENABLED : 0
  YQ_CHECKSUM_AMD64: ${{ inputs.yq-checksum-amd64 }}
  YQ_CHECKSUM_ARM64: ${{ inputs.yq-checksum-arm64 }}

jobs:
  build:
    strategy:
      matrix:
        arch:
          - x64
          - arm64
    runs-on: ${{ github.repository == 'rancher/prometheus-federator' && format('runs-on,image=ubuntu22-full-{1},runner=4cpu-linux-{1},run-id={0}', github.run_id, matrix.arch) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name : Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - name: Install yq
        uses: rancher/prometheus-federator/.github/actions/install-yq@automation-core
      - name : Install helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ inputs.helm-version }}
      - name: Run CI
        run: make ci
